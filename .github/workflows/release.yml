name: Publish release

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release.yml'
      - 'distribution/RELEASE.md'
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Validate version and publish the tagged source
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          release_tag="$GITHUB_REF_NAME"
          if [[ "$GITHUB_REF_TYPE" == branch ]]; then
            gh api "repos/$GH_REPO/contents/CMakeLists.txt?ref=$GITHUB_SHA" --jq .content | base64 --decode > CMakeLists.txt
            release_version=$(python3 -c 'from pathlib import Path; import re; print(re.search(r"project\(hyprstack VERSION (\d+\.\d+\.\d+)", Path("CMakeLists.txt").read_text())[1])')
            release_tag="v$release_version"
            # Finish publication when a first workflow and its tag were pushed
            # together before GitHub had registered the new workflow.
            if ! gh api "repos/$GH_REPO/git/ref/tags/$release_tag" >/dev/null 2>&1; then
              echo "Push $release_tag to publish this version."
              exit 0
            fi
          fi
          [[ "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          export RELEASE_TAG="$release_tag"
          notes_ref="$release_tag"
          if [[ "$GITHUB_REF_TYPE" == branch ]]; then
            notes_ref="$GITHUB_SHA"
          fi
          gh api "repos/$GH_REPO/contents/CMakeLists.txt?ref=$release_tag" --jq .content | base64 --decode > CMakeLists.txt
          gh api "repos/$GH_REPO/contents/distribution/RELEASE.md?ref=$notes_ref" --jq .content | base64 --decode > release-notes.md
          python3 - <<'PY'
          import os
          from pathlib import Path
          import re
          version = re.search(r'project\(hyprstack VERSION (\d+\.\d+\.\d+)', Path('CMakeLists.txt').read_text())
          assert version and 'v' + version[1] == os.environ['RELEASE_TAG'], 'Release tag and CMake version differ'
          PY
          if gh release view "$release_tag" >/dev/null 2>&1; then
            gh release edit "$release_tag" --title "Hyprstack ${release_tag#v}" --notes-file release-notes.md --latest
          else
            gh release create "$release_tag" --verify-tag --title "Hyprstack ${release_tag#v}" --notes-file release-notes.md --latest
          fi
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Remove obsolete update-page screenshots from releases
        if: steps.publish.outputs.published == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import tempfile

          repository = os.environ['GH_REPO']
          pages = json.loads(subprocess.check_output([
              'gh', 'api', '--paginate', '--slurp',
              f'repos/{repository}/releases?per_page=100',
          ], text=True))
          screenshot = re.compile(
              r'(?m)^[ \t]*!\[[^\n\]]*\]\(<?https://github\.com/'
              + re.escape(repository)
              + r'/releases/download/[^\s)]+/updates\.png>?\)[ \t]*\n?'
          )
          for release in (release for page in pages for release in page):
              if release.get('draft'):
                  continue
              body = release.get('body') or ''
              cleaned = screenshot.sub('', body)
              if cleaned != body:
                  with tempfile.TemporaryDirectory() as directory:
                      request = Path(directory) / 'release.json'
                      request.write_text(json.dumps({'body': cleaned.rstrip() + '\n'}))
                      subprocess.run([
                          'gh', 'api', '--method', 'PATCH',
                          f'repos/{repository}/releases/{release["id"]}',
                          '--input', str(request),
                      ], check=True, stdout=subprocess.DEVNULL)
                  print(f'Removed screenshot from {release["tag_name"]} notes')
              for asset in release.get('assets', []):
                  if asset['name'].lower() == 'updates.png':
                      subprocess.run([
                          'gh', 'api', '--method', 'DELETE',
                          f'repos/{repository}/releases/assets/{asset["id"]}',
                      ], check=True, stdout=subprocess.DEVNULL)
                      print(f'Removed {asset["name"]} from {release["tag_name"]}')
          PY
