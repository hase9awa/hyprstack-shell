# Read by xdg-desktop-portal-hyprland, which serves screen sharing.
#
# The prompt asking what to share is the shell's own, so the portal is sent
# to it instead of the separate Qt program shipped beside the portal. The
# capture itself, the PipeWire stream and everything else about it stay with
# the portal.
screencopy {
    custom_picker_binary = hyprstack-share-picker
}
